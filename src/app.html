<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="An interactive simulator of the human in the loop. Inspect rubber boots in 1978 while a machine checks them again; approve AI messages in 2026 that the AIs act on anyway."
    />
    <!-- __SITE_URL__ is filled in by the container (docker/30-site-url.sh), so the
         image names no domain. Link-preview crawlers need the absolute image URL. -->
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:site_name" content="nahkarele" />
    <meta property="og:title" content="nahkarele — the human in the loop" />
    <meta
      property="og:description"
      content="An interactive simulator of the human in the loop. Inspect rubber boots in 1978 while a machine checks them again; approve AI messages in 2026 that the AIs act on anyway."
    />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A pixel-art conveyor of rubber boots with an inspection machine, and an office desk between two black AI slabs."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f0f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="nahkarele" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>nahkarele — the human in the loop</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
