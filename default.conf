server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Container-start rewrites of the HTML (docker/*.sh) replace every occurrence.
    sub_filter_once off;

    # SPA: every path that is not a file gets the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output never changes under the same name.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell and the version file must be revalidated, or a tab never sees a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /_app/version.json {
        add_header Cache-Control "no-cache";
    }

    # When friday began (ms), kept in a cookie the server sets: Safari clears what a script stores
    # after seven days without a visit, but not cookies from the site's own responses. `?at=`
    # keeps it 400 days from now, no `at` forgets it, anything else is refused. Only a value that
    # matched the pattern ever reaches a header.
    location = /friday {
        if ($arg_at ~ "^[0-9]{10,13}$") {
            add_header Set-Cookie "friday=$arg_at; Path=/; Max-Age=34560000; SameSite=Lax; Secure";
            add_header Cache-Control "no-store";
            return 204;
        }
        if ($arg_at != "") {
            return 400;
        }
        add_header Set-Cookie "friday=; Path=/; Max-Age=0; SameSite=Lax; Secure";
        add_header Cache-Control "no-store";
        return 204;
    }

    # nginx's stock mime.types has no mapping for .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
