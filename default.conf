server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Container-start rewrites of the HTML (docker/*.sh) replace every occurrence.
    sub_filter_once off;

    # SPA: every path that is not a file gets the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build output never changes under the same name.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The shell and the version file must be revalidated, or a tab never sees a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /_app/version.json {
        add_header Cache-Control "no-cache";
    }

    # nginx's stock mime.types has no mapping for .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
